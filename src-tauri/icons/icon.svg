<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The Catalyst family: a near-black rounded square with one crimson glyph. The app is the bolt,
       Console is the wheel, Pit is the spanner. Rendered to PNG and .ico by `tauri icon`. -->
  <defs>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- The open jaw: a slot from the top of the head down to a rounded seat. -->
      <rect x="447" y="96" width="130" height="194" fill="#000"/>
      <circle cx="512" cy="290" r="65" fill="#000"/>
      <!-- The ring end's hole. -->
      <circle cx="512" cy="774" r="44" fill="#000"/>
    </mask>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="212" fill="#15161a"/>
  <g transform="rotate(45 512 512)" fill="#e94560" mask="url(#cut)">
    <circle cx="512" cy="290" r="158"/>
    <rect x="452" y="330" width="120" height="420" rx="24"/>
    <circle cx="512" cy="774" r="104"/>
  </g>
</svg>
